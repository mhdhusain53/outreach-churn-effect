artifacts = ["/app/output/analyze.py", "/app/output/adjustment_set.json", "/app/output/effect_estimate.json", "/app/output/customer_predictions.json"]

[task]
name = "outreach-churn-effect"
description = "Estimate the causal effect of a retention outreach program on time to cancellation from confounded, informatively censored subscription logs."

[metadata]
category = "Data Science and Reporting"
subcategory = "Statistical analysis and inference"
task_objective = ["analyze", "generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 5
difficulty_explanation = "A retention data scientist estimating whether a customer-success program actually reduced churn faces five independent traps in this data, and missing any one produces a plausible-looking but wrong number. First, the outreach program's targeting criteria were never recorded, so the agent must discover which pre-treatment fields in customers.csv actually predict who got outreach (a genuine confounder) versus which merely look plausible but were not part of targeting (an inert field that never biases anything if included, but wastes no correctness if omitted either) - this has to come from analyzing the data itself, e.g. checking which pre-treatment fields differ systematically between the two arms, not from a disclosed list. Second, of the fields available, some are recorded after the outreach decision (ticket counts derived from support_tickets.csv, the usage-change field in usage_summary.csv); a common but wrong instinct - adjust for everything correlated with the outcome - pulls in a collider and a mediator and biases the estimate even though it looks like careful modeling, so the agent has to use the data dictionary's timing information to rule these out regardless of how predictive they look. Third, plan_events.csv stops tracking a customer's path to cancellation once they downgrade to the free tier, and downgrade timing depends on the same customer factors that predict cancellation; a survival estimate that treats this censoring as uninformative - the default behavior of a plain Kaplan-Meier or an unweighted hazard model - is biased, and the bias does not announce itself. Fourth, an export glitch duplicated some customers' ticket history in support_tickets.csv (disclosed via a repeated ticket_id); an agent that builds its causal pipeline correctly but counts raw rows instead of deduplicating first still gets a measurably wrong ticket-activity signal, a data-hygiene slip independent of the causal reasoning in the other three. Fifth, outreach's effect on cancellation is not uniform across the customer base: it is real for starter and growth accounts but close to negligible for scale accounts, and a pooled estimate averaged over everyone obscures this. Reporting the scale-tier estimate correctly requires actually re-standardizing the fitted outcome model over that subgroup rather than reusing the pooled number, which a submission that treats the causal estimate as a single fixed quantity will get wrong even after correctly navigating the first four traps. Sixth, ticket activity is not the only thing that predicts a downgrade: declining product usage is an independent, equally real signal of a customer about to move to the free tier. A submission that checks only the obvious candidate - ticket counts, which the instructions call out by name - and stops there builds a downgrade-hazard model that is missing a real predictor, which biases the reported hazard ratio and the informative-censoring correction built on top of it even though every other trap was navigated correctly. The six traps are independent: an agent can nail any five and still miss the sixth, and a linear read-code-run pass tends to drop at least one on the first attempt. Seventh, customers.csv outreach_flag is the latest value in the export, which can be revised after day 0; the assignment that belongs in the outcome model is the one already published as of day 0, recovered from assignment_revisions.csv. On a calibration extract with no later revisions, using the customers.csv column agrees with that as-of rule, so a pipeline that never opens the revision log still looks right. An export of the same schema with late revisions does not: treating the latest flag as the day-0 assignment also hides the login-frequency imbalance that targeting actually used. Eighth, each customers.csv row carries an integrity checksum: a position-weighted ASCII sum of the pipe-joined baseline fields, reduced modulo a prime that is recoverable from matching rows, not a named CRC or digest. A calibration extract in which every row matches lets a trust-all pipeline agree with dropping mismatches, while an export with planted mismatches does not. The data is fully synthetic, generated from a structural model with known confounders, a known collider, a known mediator, two known informative-censoring mechanisms, a known heterogeneous treatment effect, late assignment revisions, and planted integrity mismatches, which is what makes an exact numeric answer available for grading."
solution_explanation = "Drop customers.csv rows whose integrity field does not recompute: join the five baseline fields with |, take the position-squared ASCII sum, and reduce modulo the prime recovered from matching rows (for an intact row the prime divides sum minus stored value, so pairwise GCDs of neighbouring rows yield candidate primes and the one under which the most rows recompute is the modulus; a GCD over every row collapses to 1 once planted mismatches are present). Replace outreach_flag with the assignment that was known as of day 0 from assignment_revisions.csv (revisions published after day 0 do not count; among those already known, the latest recorded row wins). Merge the four remaining tables into one customer-level frame. Classify each available field by when it was measured relative to day 0, then check each pre-treatment field (plan_tier, monthly_spend_usd, login_freq_pre30d, tenure_days_pre) for a systematic difference between the day-0 outreach arms: plan_tier, monthly_spend_usd, and login_freq_pre30d are all associated with the day-0 assignment and are real confounders that belong in the adjustment set; tenure_days_pre shows no such association, so including it is harmless but not required. Ticket count and the usage-change field are both measured after day 0 and must be left out of the outcome model regardless of how predictive either looks. Before counting tickets, drop duplicate ticket_id rows caused by the export glitch data_dictionary.md discloses. Separately, test whether downgrade timing depends on the same pre-treatment factors, on ticket activity, and on the usage-change field (all three are legitimate inputs to a censoring model even though ticket activity and usage-change are barred from the outcome model) that predict cancellation; it does, on all three. Fit a discrete-time logistic hazard model for the downgrade event using those factors, the day-0 outreach assignment, and log(1 + days since day 0) as the sole time term, by unpenalized maximum likelihood to convergence (sklearn's default solver tolerance stops short of the MLE on a million-row person-day expansion without warning, which is why the reference uses a tight-tolerance Newton fit and treats a convergence warning as an error), convert each customer's fitted probability of not having downgraded through day t into the weight 1 / max(0.04, S_C(t)), and fit a weighted discrete-time logistic cancellation hazard on the same time term using only the confounders plus the day-0 outreach assignment. Standardize survival curves under outreach=1 and outreach=0 over the observed covariate distribution (the g-formula) and take the RMST difference at the 180-day horizon for the pooled estimate, then repeat the same standardization restricted to scale-tier customers only for the subgroup estimate, using the same fitted outcome model. The same fitted cancellation model, evaluated at each named customer's own day-0 assignment rather than a counterfactual or a later revision, gives the day-90 survival probabilities for customer_predictions.json. Write analyze.py so the same pipeline recomputes those files from whatever /app/data currently contains. A senior analyst who already reasons in these terms needs about five focused hours: the integrity recovery, the as-of assignment, the balance check, timing analysis, the censoring diagnostic, model fitting, the subgroup re-standardization, and a sanity check that the IPCW correction actually moved the estimate."
verification_explanation = "At grade time the verifier copies trusted tables from tests/fixtures/heldout over /app/data (hash-checked), snapshots hashes of every file under /tests, makes /tests root-only, deletes the three JSON outputs, re-runs a copy of /app/output/analyze.py, together with the sibling .py helper modules instruction.md tells the agent to keep beside it, from a fresh directory as user nobody (with -E -s, so the copied siblings stay importable while environment and user-site hooks are ignored) so that script cannot read the grader or write reward.txt, requires those JSON files to be newer than that re-run, restores /tests mode, refuses to grade if grader hashes changed, then grades the JSON. Two artifacts are graded on independent axes so that getting one right cannot compensate for missing the other. adjustment_set.json is checked by set membership, not exact match: it fails if any post-treatment field is present, and fails if any of the three true confounders of the day-0 assignment is missing; the optional pre-treatment field is never penalized either way. Using the latest customers.csv outreach_flag as if it were the day-0 assignment, on the held-out export, makes login_freq_pre30d look balanced, so a submission that re-runs its sample balance check on that column omits a required confounder. effect_estimate.json is checked on four numbers, each against a value computed offline from the known data-generating process or recomputed from verifier-owned copies of the raw input tables. downgrade_hazard_ratio_per_sd_tickets is checked against the hazard ratio a correctly specified downgrade-hazard model recovers on integrity-valid rows - this quantity is reproducible only by actually fitting a downgrade-hazard model on the real (deduplicated) ticket data that also accounts for the usage-change signal and drops integrity mismatches; a submission that forgets to deduplicate, that only checks ticket activity and never considers usage-change as a candidate censoring covariate, or that trusts every customers.csv row, lands measurably below the band even though every other check still passes. outcome_model_effective_sample_size is checked against the raw total person-days among integrity-valid customers, recomputed by the test from the restored tables: an outcome hazard fit that never applies the censoring weights has every weight equal to 1, so its effective sample size equals that raw total exactly, while any real inverse-probability-of-censoring weighting shrinks it measurably; this catches a submission that builds the right censoring model but never applies it to the final estimate, which the RMST number alone would not reliably flag. max_ipcw_weight is checked against the value instruction.md discloses follows directly from the stated 0.04 floor (25 = 1/0.04): this makes that disclosed convention an enforced requirement rather than an unchecked number, since a submission that applies a different floor produces a different maximum weight even when its RMST and ESS both still land inside their own wider bands. rmst_difference_days is checked against the causal RMST difference a correctly adjusted, IPCW-corrected g-formula estimator recovers on this dataset when cancellation and downgrade hazards are discrete-time logistic models with log(1 + days since day 0) as the sole time term, fit by unpenalized maximum likelihood to convergence, using the day-0 assignment and integrity-valid rows. Every band was calibrated on converged fits (newton-cholesky and statsmodels agree to ~1e-5), and the instruction-permitted choices (tenure_days_pre in or out of the adjustment set, which optional covariates join the downgrade model, which library does the fitting) move this number by about 0.1 day, so the band admits all of them while excluding using the latest export flag as the treatment, trusting integrity mismatches, and an unadjusted comparison of the two arms, each of which misses by several times the band width; skipping the censoring correction and a collider/mediator adjustment barely move this number and are caught instead by the effective-sample-size check and the adjustment_set.json check. A submission that fits the outcome model on only a subset of the three confounders is caught independently by the adjustment_set.json check, not by this band, since a subset-adjustment estimate can land close to the correctly adjusted one on this data. rmst_difference_days_scale_tier is checked against its own, separately calibrated band, well below the pooled band and non-overlapping with it: a submission that reuses the pooled number, or restandardizes over the wrong subgroup, lands outside this band even when every other field is correct. customer_predictions.json is checked against 25 named customers' predicted probabilities of remaining active at day 90 from the reference model, requiring at least 24 of 25 within an absolute tolerance of 0.012. That reference is fully specified by instruction.md and the data dictionary - a discrete-time logistic hazard on the three required confounders plus the day-0 outreach assignment with log(1 + day) as the sole time term, weighted by 1 / max(0.04, S_C(t)) with S_C(t) the fitted probability of not having downgraded through day t, fit by unpenalized maximum likelihood to convergence - and the stored values are that model's converged MLE on the held-out export. Any correct implementation reproduces them: sklearn with a tight tolerance and no penalty, statsmodels Logit and GLM, tenure in or out of the adjustment set, and outreach_flag or tenure in or out of the downgrade model all agree with the stored values to within 0.0005, so the tolerance is about twenty times the spread across compliant pipelines. It still rejects the errors this file is the only check for: fitting tenure_days_pre into this model (12 of 25 within tolerance), using the latest outreach flag (10 of 25), trusting integrity mismatches (1 of 25), and a solver left at its default tolerance, which stops several log-likelihood units short of the MLE on a million-row person-day expansion and shifts these values by up to 0.05 (18 of 25). Skipping the censoring weights or changing the floor moves these predictions by at most 0.01, so those conventions are enforced by the effective-sample-size and max-weight checks rather than here. Because each value depends on that specific customer's covariates run through the fitted model, a submission that hardcodes plausible aggregate numbers instead of doing the analysis - the one class of wrong answer none of the aggregate-level bands above can rule out - has no way to get more than a handful of these right by chance. Doing nothing fails outright because analyze.py and the three JSON files do not exist."

